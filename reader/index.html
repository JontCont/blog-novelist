<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小說庫</title>
    <style>
      :root {
        --reader-ink: #172033;
        --reader-muted: #657084;
        --reader-rule: #d9e0e8;
        --reader-accent: #b44b3f;
        --reader-paper: #fcfdff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--reader-ink);
        background: var(--reader-paper);
        font-family: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", Georgia, serif;
        line-height: 1.9;
      }

      .reader-shell {
        width: min(100%, 820px);
        margin: 0 auto;
        padding: 44px clamp(20px, 5vw, 60px) 88px;
      }

      .reader-header {
        padding-bottom: 24px;
        border-bottom: 1px solid var(--reader-rule);
      }

      .reader-eyebrow {
        margin: 0 0 8px;
        color: var(--reader-accent);
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .reader-header h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.2;
      }

      .reader-header p:last-child {
        max-width: 62ch;
        margin: 14px 0 0;
        color: var(--reader-muted);
      }

      .reader-view[hidden] { display: none; }

      .reader-back {
        display: inline-block;
        margin-bottom: 24px;
        color: var(--reader-accent);
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
      }

      .reader-menu {
        padding-top: 32px;
      }

      .reader-menu h2 {
        margin: 0 0 10px;
        font-size: 1.25rem;
      }

      .novel-details {
        margin-top: 28px;
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }

      .novel-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        border-bottom: 1px solid var(--reader-rule);
      }

      .novel-tab {
        min-height: 46px;
        padding: 10px 16px;
        color: var(--reader-muted);
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        font: inherit;
        font-size: 0.94rem;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
      }

      .novel-tab[aria-selected="true"] {
        color: var(--reader-accent);
        border-bottom-color: var(--reader-accent);
      }

      .novel-tab:focus-visible,
      .timeline-link:focus-visible {
        outline: 2px solid var(--reader-accent);
        outline-offset: 2px;
      }

      .novel-panel {
        min-height: 150px;
        padding: 22px 0 28px;
      }

      .novel-panel h2 {
        margin: 0 0 12px;
        font-size: 1.12rem;
      }

      .novel-about {
        max-width: 66ch;
        margin: 0;
        color: var(--reader-muted);
        line-height: 1.8;
      }

      .character-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .character-card {
        padding: 16px 18px;
        border: 1px solid var(--reader-rule);
        border-radius: 6px;
        background: #fff;
      }

      .character-card h3 {
        margin: 0 0 4px;
        font-size: 1rem;
      }

      .character-card__role {
        display: block;
        margin-bottom: 8px;
        color: var(--reader-accent);
        font-size: 0.84rem;
        font-weight: 700;
      }

      .character-card p {
        margin: 0;
        color: var(--reader-muted);
        font-size: 0.92rem;
        line-height: 1.7;
      }

      .story-timeline {
        margin: 0;
        padding: 0 0 0 8px;
        list-style: none;
      }

      .story-timeline li {
        position: relative;
        padding: 0 0 20px 25px;
        border-left: 1px solid var(--reader-rule);
      }

      .story-timeline li:last-child {
        padding-bottom: 0;
        border-left-color: transparent;
      }

      .story-timeline li::before {
        position: absolute;
        top: 7px;
        left: -5px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--reader-accent);
        content: "";
      }

      .timeline-link {
        display: inline-block;
        color: var(--reader-ink);
        font-weight: 700;
        text-decoration: none;
      }

      .timeline-link:hover { color: var(--reader-accent); }

      .timeline-period {
        margin-left: 8px;
        color: var(--reader-accent);
        font-size: 0.83rem;
        font-weight: 700;
      }

      .timeline-event {
        margin: 3px 0 0;
        color: var(--reader-muted);
        font-size: 0.92rem;
        line-height: 1.65;
      }

      .novel-empty {
        margin: 0;
        color: var(--reader-muted);
      }

      .novel-panel .chapter-list li:first-child { border-top: 1px solid var(--reader-rule); }

      .novel-panel .chapter-list a {
        display: block;
        min-height: 56px;
        padding: 14px 0;
        color: var(--reader-ink);
        font-weight: 700;
        text-decoration: none;
      }

      .novel-panel .chapter-list a:hover { color: var(--reader-accent); }

      .chapter-timeline {
        margin: 24px 0 0;
        border-top: 1px solid var(--reader-rule);
        border-bottom: 1px solid var(--reader-rule);
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }

      .chapter-timeline > summary {
        min-height: 48px;
        padding: 12px 0;
        color: var(--reader-accent);
        font-weight: 700;
        cursor: pointer;
      }

      .chapter-timeline__hint {
        margin: 0 0 16px;
        color: var(--reader-muted);
        font-size: 0.86rem;
      }

      .story-timeline__current {
        color: var(--reader-accent);
        font-weight: 700;
      }

      .story-timeline__current-label {
        display: inline-block;
        margin-left: 8px;
        padding: 1px 7px;
        border: 1px solid var(--reader-accent);
        border-radius: 999px;
        font-size: 0.76rem;
      }

      .filter-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }

      .filter-tag {
        min-height: 34px;
        padding: 5px 12px;
        color: var(--reader-muted);
        border: 1px solid var(--reader-rule);
        border-radius: 999px;
        background: #fff;
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-size: 0.86rem;
        font-weight: 700;
        cursor: pointer;
      }

      .filter-tag:hover,
      .filter-tag[aria-pressed="true"] {
        color: #fff;
        border-color: var(--reader-accent);
        background: var(--reader-accent);
      }

      .filter-tag:focus-visible {
        outline: 2px solid var(--reader-accent);
        outline-offset: 2px;
      }

      .chapter-list {
        margin: 0;
        padding: 0;
        list-style: none;
        border-bottom: 1px solid var(--reader-rule);
      }

      .novel-list li,
      .chapter-list li {
        border-top: 1px solid var(--reader-rule);
      }

      .novel-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(156px, 200px));
        gap: 22px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .novel-card__link {
        display: block;
        color: var(--reader-ink);
        text-decoration: none;
      }

      .novel-card__cover {
        position: relative;
        display: block;
        aspect-ratio: 2 / 3;
        overflow: hidden;
        border-radius: 6px;
        background: #25304a;
        box-shadow: 0 10px 22px rgba(23, 32, 51, 0.16);
      }

      .novel-card__cover::after {
        position: absolute;
        inset: 0;
        content: "";
        background: rgba(23, 32, 51, 0.42);
      }

      .novel-card__new {
        position: absolute;
        z-index: 2;
        top: 12px;
        right: 12px;
        padding: 4px 8px;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.68);
        border-radius: 4px;
        background: var(--reader-accent);
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .novel-card__cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 180ms ease;
      }

      .novel-card__link:hover .novel-card__cover img {
        transform: scale(1.04);
      }

      .novel-card__cover-title {
        position: absolute;
        z-index: 1;
        right: 18px;
        bottom: 18px;
        left: 18px;
        color: #fff;
        font-family: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", Georgia, serif;
        font-size: 1.75rem;
        font-weight: 700;
        line-height: 1.25;
      }

      .novel-card__body {
        padding-top: 12px;
      }

      .novel-card__genre {
        display: block;
        color: var(--reader-accent);
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .novel-card__description {
        display: block;
        margin-top: 4px;
        color: var(--reader-muted);
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-size: 0.9rem;
        line-height: 1.65;
      }

      .reader-menu a {
        display: block;
        padding: 18px 0;
        color: var(--reader-ink);
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-weight: 700;
        text-decoration: none;
      }

      .reader-menu a:hover {
        color: var(--reader-accent);
      }

      .novel-card__link:hover { color: var(--reader-ink); }

      .reader-menu a:focus-visible,
      .reader-back:focus-visible {
        outline: 2px solid var(--reader-accent);
        outline-offset: 3px;
      }

      .chapter-content {
        padding-top: 38px;
        font-size: clamp(1.04rem, 2vw, 1.18rem);
      }

      .chapter-content h2,
      .chapter-content h3 {
        margin: 0 0 28px;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        line-height: 1.3;
      }

      .chapter-content p {
        max-width: 44rem;
        margin: 0 auto 1.5em;
      }

      @media (max-width: 600px) {
        .reader-shell { padding-top: 30px; }

        .novel-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }

        .novel-card__cover-title {
          right: 14px;
          bottom: 14px;
          left: 14px;
          font-size: 1.45rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="reader-shell">
      <section id="library-view" class="reader-view">
        <header class="reader-header">
          <p class="reader-eyebrow">JConte 小說庫</p>
          <h1 id="library-title">小說庫</h1>
          <p>選擇作品後查看章節目錄與內容。</p>
        </header>

        <nav class="reader-menu" aria-label="作品清單">
          <h2>作品</h2>
          <div id="genre-filters" class="filter-tags" role="group" aria-label="快速查詢"></div>
          <ul id="novel-list" class="novel-list"></ul>
        </nav>
      </section>

      <section id="novel-view" class="reader-view" hidden>
        <a class="reader-back" href="#">返回小說庫</a>
        <header class="reader-header">
          <p class="reader-eyebrow">作品</p>
          <h1 id="novel-title"></h1>
          <p id="novel-description"></p>
        </header>

        <section id="novel-details" class="novel-details" aria-label="作品資料" hidden>
          <div class="novel-tabs" role="tablist" aria-label="作品資料分類">
            <button id="novel-tab-about" class="novel-tab" type="button" role="tab" aria-selected="true" aria-controls="novel-panel" data-novel-tab="about">關於</button>
            <button id="novel-tab-characters" class="novel-tab" type="button" role="tab" aria-selected="false" aria-controls="novel-panel" data-novel-tab="characters" tabindex="-1">人物介紹</button>
            <button id="novel-tab-chapters" class="novel-tab" type="button" role="tab" aria-selected="false" aria-controls="novel-panel" data-novel-tab="chapters" tabindex="-1">章節</button>
          </div>
          <div id="novel-panel" class="novel-panel" role="tabpanel" tabindex="0" aria-labelledby="novel-tab-about"></div>
        </section>
      </section>

      <section id="chapter-view" class="reader-view" hidden>
        <a id="chapter-back" class="reader-back" href="#">返回章節目錄</a>
        <header class="reader-header">
          <p id="chapter-novel" class="reader-eyebrow"></p>
          <h1 id="chapter-title"></h1>
        </header>

        <details id="chapter-timeline" class="chapter-timeline" hidden>
          <summary>故事時間軸</summary>
          <p class="chapter-timeline__hint">依故事順序排列；事件摘要可能透露後續章節。</p>
          <ol id="chapter-timeline-list" class="story-timeline"></ol>
        </details>

        <article id="chapter-content" class="chapter-content" aria-live="polite"></article>
      </section>
    </main>

    <script>
      (async function () {
        const chapterContent = document.getElementById('chapter-content');
        const libraryTitle = document.getElementById('library-title');
        const novelDescription = document.getElementById('novel-description');
        const novelList = document.getElementById('novel-list');
        const genreFilters = document.getElementById('genre-filters');
        const novelTitle = document.getElementById('novel-title');
        const chapterNovel = document.getElementById('chapter-novel');
        const chapterTitle = document.getElementById('chapter-title');
        const chapterTimeline = document.getElementById('chapter-timeline');
        const chapterTimelineList = document.getElementById('chapter-timeline-list');
        const novelDetails = document.getElementById('novel-details');
        const novelPanel = document.getElementById('novel-panel');
        const novelTabs = Array.from(document.querySelectorAll('[data-novel-tab]'));
        const chapterBack = document.getElementById('chapter-back');
        const libraryView = document.getElementById('library-view');
        const novelView = document.getElementById('novel-view');
        const chapterView = document.getElementById('chapter-view');
        const novelsBySlug = new Map();
        const chaptersById = new Map();
        const newWindowMs = 7 * 24 * 60 * 60 * 1000;
        let activeGenre = '全部';
        const library = await fetch('library.json').then(function (response) {
          if (!response.ok) throw new Error('無法載入小說庫資料。');
          return response.json();
        });

        function escapeHtml(value) {
          return value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function renderInline(value) {
          return escapeHtml(value).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        }

        function renderMarkdown(markdown) {
          return markdown.trim().split(/\r?\n\s*\r?\n/).map(function (block) {
            const heading = block.match(/^(#{1,6})\s+(.+)$/);
            if (heading) {
              if (heading[1].length === 1) return '';
              const level = Math.min(heading[1].length + 1, 6);
              return '<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>';
            }
            return '<p>' + renderInline(block).replace(/\r?\n/g, '<br>') + '</p>';
          }).join('');
        }

        function isNewNovel(novel) {
          if (!novel.publishedAt) return false;
          const publishedAt = Date.parse(novel.publishedAt);
          if (!Number.isFinite(publishedAt)) return false;
          const age = Date.now() - publishedAt;
          return age >= 0 && age <= newWindowMs;
        }

        function showView(view) {
          libraryView.hidden = view !== libraryView;
          novelView.hidden = view !== novelView;
          chapterView.hidden = view !== chapterView;
        }

        function renderLibrary() {
          showView(libraryView);
        }

        function renderNovel(novel) {
          novelTitle.textContent = novel.title;
          novelDescription.textContent = novel.description;
          renderNovelDetails(novel);
          showView(novelView);
        }

        function renderNovelDetails(novel) {
          novelDetails.hidden = false;
          selectNovelTab('about');
        }

        function selectNovelTab(tabName) {
          const activeTab = novelTabs.find(function (tab) { return tab.dataset.novelTab === tabName; });
          if (!activeTab) return;
          novelTabs.forEach(function (tab) {
            const selected = tab === activeTab;
            tab.setAttribute('aria-selected', String(selected));
            tab.tabIndex = selected ? 0 : -1;
          });
          novelPanel.setAttribute('aria-labelledby', activeTab.id);
          novelPanel.replaceChildren();
          const novel = novelsBySlug.get(decodeURIComponent(location.hash.slice(1)).split('/')[0]);
          const details = novel && novel.details ? novel.details : {};

          if (tabName === 'chapters') {
            const heading = document.createElement('h2');
            heading.textContent = '章節目錄';
            novelPanel.appendChild(heading);
            const list = document.createElement('ol');
            list.className = 'chapter-list';
            novel.chapters.forEach(function (chapter) {
              const item = document.createElement('li');
              const link = document.createElement('a');
              link.href = '#' + novel.slug + '/' + chapter.number;
              link.textContent = '第 ' + chapter.number + ' 章：' + chapter.title;
              item.appendChild(link);
              list.appendChild(item);
            });
            novelPanel.appendChild(list);
            return;
          }

          if (tabName === 'about') {
            const heading = document.createElement('h2');
            heading.textContent = '關於這部作品';
            const copy = document.createElement('p');
            copy.className = 'novel-about';
            copy.textContent = details.about || novel.description;
            novelPanel.append(heading, copy);
            return;
          }

          if (tabName === 'characters') {
            const heading = document.createElement('h2');
            heading.textContent = '人物介紹';
            novelPanel.appendChild(heading);
            if (!details.characters || details.characters.length === 0) {
              const empty = document.createElement('p');
              empty.className = 'novel-empty';
              empty.textContent = '人物資料尚未整理。';
              novelPanel.appendChild(empty);
              return;
            }
            const list = document.createElement('ul');
            list.className = 'character-list';
            details.characters.forEach(function (character) {
              const item = document.createElement('li');
              const card = document.createElement('article');
              const name = document.createElement('h3');
              const role = document.createElement('span');
              const description = document.createElement('p');
              card.className = 'character-card';
              name.textContent = character.name;
              role.className = 'character-card__role';
              role.textContent = character.role;
              description.textContent = character.description;
              card.append(name, role, description);
              item.appendChild(card);
              list.appendChild(item);
            });
            novelPanel.appendChild(list);
            return;
          }

        }

        function renderChapterTimeline(novel, currentChapter) {
          const entries = novel.details && Array.isArray(novel.details.timeline) ? novel.details.timeline : [];
          chapterTimelineList.replaceChildren();
          chapterTimeline.open = false;
          chapterTimeline.hidden = entries.length === 0;
          if (entries.length === 0) return;

          entries.forEach(function (event) {
            const chapter = novel.chapters.find(function (entry) { return String(entry.number) === String(event.chapter); });
            if (!chapter) return;
            const item = document.createElement('li');
            const current = String(chapter.number) === String(currentChapter.number);
            const title = document.createElement(current ? 'span' : 'a');
            const period = document.createElement('span');
            const summary = document.createElement('p');
            title.textContent = '第 ' + chapter.number + ' 章：' + chapter.title;
            title.className = current ? 'story-timeline__current' : 'timeline-link';
            if (current) {
              title.setAttribute('aria-current', 'step');
              const label = document.createElement('span');
              label.className = 'story-timeline__current-label';
              label.textContent = '正在閱讀';
              title.appendChild(label);
            } else {
              title.href = '#' + novel.slug + '/' + chapter.number;
            }
            period.className = 'timeline-period';
            period.textContent = event.period;
            summary.className = 'timeline-event';
            summary.textContent = event.event;
            item.append(title, period, summary);
            chapterTimelineList.appendChild(item);
          });
        }

        novelTabs.forEach(function (tab, index) {
          tab.addEventListener('click', function () {
            selectNovelTab(tab.dataset.novelTab);
          });
          tab.addEventListener('keydown', function (event) {
            let nextIndex = index;
            if (event.key === 'ArrowRight') nextIndex = (index + 1) % novelTabs.length;
            else if (event.key === 'ArrowLeft') nextIndex = (index + novelTabs.length - 1) % novelTabs.length;
            else if (event.key === 'Home') nextIndex = 0;
            else if (event.key === 'End') nextIndex = novelTabs.length - 1;
            else return;
            event.preventDefault();
            novelTabs[nextIndex].focus();
            selectNovelTab(novelTabs[nextIndex].dataset.novelTab);
          });
        });

        async function renderChapter(entry) {
          chapterNovel.textContent = entry.novel.title;
          chapterTitle.textContent = '第 ' + entry.chapter.number + ' 章：' + entry.chapter.title;
          chapterBack.href = '#' + entry.novel.slug;
          renderChapterTimeline(entry.novel, entry.chapter);
          chapterContent.textContent = '載入中...';
          showView(chapterView);
          const response = await fetch(entry.chapter.source);
          if (!response.ok) throw new Error('無法載入章節內容。');
          chapterContent.innerHTML = renderMarkdown(await response.text());
        }

        function createNovelCard(novel) {
          const item = document.createElement('li');
          const link = document.createElement('a');
          const cover = document.createElement('span');
          const image = document.createElement('img');
          const coverTitle = document.createElement('span');
          const newTag = document.createElement('span');
          const body = document.createElement('span');
          const genre = document.createElement('span');
          const description = document.createElement('span');
          item.className = 'novel-card';
          link.href = '#' + novel.slug;
          link.className = 'novel-card__link';
          cover.className = 'novel-card__cover';
          image.src = novel.cover;
          image.alt = novel.title + '封面';
          image.loading = 'lazy';
          coverTitle.className = 'novel-card__cover-title';
          coverTitle.textContent = novel.title;
          if (isNewNovel(novel)) {
            newTag.className = 'novel-card__new';
            newTag.textContent = 'NEW';
            newTag.setAttribute('aria-label', '新作品');
          }
          body.className = 'novel-card__body';
          genre.className = 'novel-card__genre';
          genre.textContent = novel.genre;
          description.className = 'novel-card__description';
          description.textContent = novel.description;
          cover.appendChild(image);
          if (isNewNovel(novel)) cover.appendChild(newTag);
          cover.appendChild(coverTitle);
          body.appendChild(genre);
          body.appendChild(description);
          link.appendChild(cover);
          link.appendChild(body);
          item.appendChild(link);
          return item;
        }

        function renderNovelList() {
          novelList.replaceChildren();
          library.novels
            .filter(function (novel) {
              return activeGenre === '全部' || novel.genre === activeGenre;
            })
            .forEach(function (novel) {
              novelList.appendChild(createNovelCard(novel));
            });
        }

        function renderGenreFilters() {
          const genres = ['全部'].concat(Array.from(new Set(library.novels.map(function (novel) {
            return novel.genre;
          }))));
          genreFilters.replaceChildren();
          genres.forEach(function (genre) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'filter-tag';
            button.textContent = genre;
            button.setAttribute('aria-pressed', String(genre === activeGenre));
            button.addEventListener('click', function () {
              activeGenre = genre;
              renderGenreFilters();
              renderNovelList();
            });
            genreFilters.appendChild(button);
          });
        }

        libraryTitle.textContent = library.title;
        library.novels.forEach(function (novel) {
          novelsBySlug.set(novel.slug, novel);

          novel.chapters.forEach(function (chapter) {
            const chapterId = novel.slug + ':' + chapter.number;
            chaptersById.set(chapterId, { novel: novel, chapter: chapter });
          });
        });
        renderGenreFilters();
        renderNovelList();

        async function renderRoute() {
          const parts = decodeURIComponent(location.hash.slice(1)).split('/');
          const novel = novelsBySlug.get(parts[0]);
          if (!parts[0] || !novel) {
            renderLibrary();
            return;
          }

          if (!parts[1]) {
            renderNovel(novel);
            return;
          }

          const entry = chaptersById.get(novel.slug + ':' + parts[1]);
          if (!entry) {
            renderNovel(novel);
            return;
          }

          await renderChapter(entry);
        }

        document.addEventListener('click', function (event) {
          const link = event.target.closest('.reader-shell a[href^="#"]');
          if (!link) return;

          event.preventDefault();
          const hash = link.getAttribute('href');
          if (location.hash === hash) {
            renderRoute().catch(function (error) {
              chapterContent.textContent = error.message;
            });
          } else {
            location.hash = hash;
          }
        });

        window.addEventListener('hashchange', function () {
          renderRoute().catch(function (error) {
            chapterContent.textContent = error.message;
          });
        });

        await renderRoute();
      })().catch(function (error) {
        document.getElementById('chapter-content').textContent = error.message;
      });
    </script>
  </body>
</html>
